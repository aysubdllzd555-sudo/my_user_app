<!DOCTYPE html>
<html>
<head>
  <title>Users index page</title>
</head>
<body>
  <h1>Users</h1>
  <table id="users-table">
    <tr>
      <th>FirstName</th>
      <th>LastName</th>
      <th>Age</th>
      <th>Email</th>
    </tr>
  </table>

  <script>
    fetch('/users')
      .then(response => response.json())
      .then(users => {
        const table = document.getElementById('users-table');
        
        users.forEach(user => {
          const row = `<tr>
            <td>${user.firstname}</td>
            <td>${user.lastname}</td>
            <td>${user.age}</td>
            <td>${user.email}</td>
          </tr>`;
          table.innerHTML += row;
        });
      });
  </script>
</body>
</html>
